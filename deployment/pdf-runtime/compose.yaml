services:
  nuaforma:
    image: ${NUAFORMA_IMAGE:-nuaforma:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: service
      platforms: [linux/amd64]
      additional_contexts:
        pdfvalidation: ../../nuaforma-docx-pdf/build/pdf-validation
        verapdfvalidation: ../../nuaforma-docx-pdf/build/verapdf-validation
        application: ../../nuaforma-server/build/install/nuaforma-server
    platform: linux/amd64
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp.json
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NUAFORMA_HEAP_MB: "512"
      NUAFORMA_HOST: "0.0.0.0"
      NUAFORMA_PORT: "8080"
    volumes:
      - type: bind
        source: ${NUAFORMA_CUSTOM_FONTS_DIR:-./custom-fonts}
        target: /opt/nuaforma/custom-fonts
        read_only: true
      - type: bind
        source: ${NUAFORMA_EXTENSIONS_DIR:-./extensions}
        target: /opt/nuaforma/extensions
        read_only: true
    stop_grace_period: 15s
    networks: [private]
networks:
  private:
    driver: bridge
