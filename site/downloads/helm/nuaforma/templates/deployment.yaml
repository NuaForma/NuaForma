apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: nuaforma
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nuaforma
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 15
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: Localhost
          localhostProfile: {{ required "Install the reviewed seccomp profile on every eligible node" .Values.seccomp.localhostProfile | quote }}
      containers:
        - name: nuaforma
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}{{ end }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NUAFORMA_HEAP_MB
              value: "512"
            - name: NUAFORMA_HOST
              value: "0.0.0.0"
            - name: NUAFORMA_PORT
              value: "8080"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            {{- if .Values.fonts.existingClaim }}
            - name: fonts
              mountPath: /opt/nuaforma/custom-fonts
              readOnly: true
            {{- end }}
            {{- if .Values.extensions.existingClaim }}
            - name: extensions
              mountPath: /opt/nuaforma/extensions
              readOnly: true
            {{- end }}
      volumes:
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        {{- if .Values.fonts.existingClaim }}
        - name: fonts
          persistentVolumeClaim:
            claimName: {{ .Values.fonts.existingClaim | quote }}
            readOnly: true
        {{- end }}
        {{- if .Values.extensions.existingClaim }}
        - name: extensions
          persistentVolumeClaim:
            claimName: {{ .Values.extensions.existingClaim | quote }}
            readOnly: true
        {{- end }}
