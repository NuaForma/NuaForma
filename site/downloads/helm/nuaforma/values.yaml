image:
  repository: ghcr.io/nuaforma/nuaforma
  tag: 0.2.0-alpha.1
  digest: sha256:0a9c878d8dccbaaa8c664983f75b8b14962fa7e1ab822979571b6af8c72550ac
seccomp:
  localhostProfile: nuaforma/seccomp.json
fonts:
  existingClaim: ""
extensions:
  existingClaim: ""
resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector:
  kubernetes.io/os: linux
  kubernetes.io/arch: amd64
probes:
  startup:
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
