name: Publish audited alpha container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'NuaForma/NuaForma' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ghcr-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out approved release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete review and exact archived image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/check_environment.py --environment ghcr-release
          python3 tools/release/validate_release_gate.py --version 0.1.0-alpha.1 --review release-approvals/0.1.0-alpha.1.json
          mkdir -p build/alpha
          gh release download v0.1.0-alpha.1 --repo NuaForma/NuaForma --pattern 'nuaforma-container-0.1.0-alpha.1.tar.gz' --dir build/alpha
          python3 tools/release/check_image_archive.py --review release-approvals/0.1.0-alpha.1.json --archive build/alpha/nuaforma-container-0.1.0-alpha.1.tar.gz
          docker load --input build/alpha/nuaforma-container-0.1.0-alpha.1.tar.gz
          python3 tools/release/check_image_archive.py --review release-approvals/0.1.0-alpha.1.json --archive build/alpha/nuaforma-container-0.1.0-alpha.1.tar.gz --check-loaded
      - name: Tag the already qualified exact transferred image
        run: |
          IMAGE=nuaforma:0.1.0-alpha.1-archive
          docker tag "$IMAGE" ghcr.io/nuaforma/nuaforma:0.1.0-alpha.1
      - name: Authenticate and push the immutable alpha tag only
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          python3 tools/release/ensure_tag_absent.py
          docker push ghcr.io/nuaforma/nuaforma:0.1.0-alpha.1
      - name: Clear registry authentication
        if: always()
        run: docker logout ghcr.io

# No latest/stable alias, Docker socket mount, privileged mode or unconfined filter.
