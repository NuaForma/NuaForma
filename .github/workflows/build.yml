name: Build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            other-java: '25'
          - java: '25'
            other-java: '17'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the other compilation toolchain
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.other-java }}

      - name: Set up build Java ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Validate Gradle Wrapper
        run: |
          echo '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          test -x gradlew

      - name: Build and test all modules
        run: ./gradlew --no-daemon build generatePomFileForMavenJavaPublication --warning-mode=fail

      - name: Verify independent Java 17 library consumers
        if: matrix.java == '17'
        run: ./gradlew --no-daemon verifyEmbeddedConsumers --warning-mode=fail
