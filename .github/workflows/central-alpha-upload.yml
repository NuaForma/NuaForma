name: Upload reviewed alpha to Central

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-publication
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'NuaForma/NuaForma' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: maven-central
    steps:
      - name: Check out approved release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify environment and complete release gate before loading secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/maven_destination.py --central "0.1.0-alpha.1"
          python3 tools/release/check_environment.py
          python3 tools/release/validate_release_gate.py --version 0.1.0-alpha.1 --review release-approvals/0.1.0-alpha.1.json
          cp release-approvals/0.1.0-alpha.1.json "$RUNNER_TEMP/alpha-review.json"
          git checkout --detach v0.1.0-alpha.1
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle Wrapper
        run: |
          echo '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          test -x gradlew
      - name: Verify exact unsigned alpha libraries and consumers
        run: ./gradlew --no-daemon build verifyEmbeddedConsumers --warning-mode=fail
      - name: Obtain approved public verification key
        run: |
          mkdir -p build/alpha
          curl --fail --silent --show-error --proto '=https' --max-time 30 \
            'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x74317C6CE9C61B80A2A1C0B40F736E8D598CB08B' --output build/alpha/public.asc
      - name: Sign the exact candidate
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon stageLibraries -PsignArtifacts=true --no-build-cache --no-configuration-cache --warning-mode=fail
      - name: Verify and assemble local bundle
        run: |
          python3 tools/release/prepare_central_bundle.py --repository build/library-repository --version 0.1.0-alpha.1 \
            --fingerprint 74317C6CE9C61B80A2A1C0B40F736E8D598CB08B --public-key build/alpha/public.asc --output build/alpha/central.zip
          python3 tools/release/check_bundle_review.py --bundle-record build/alpha/central.zip.json --review "$RUNNER_TEMP/alpha-review.json"
      - name: Upload once for Portal validation without automatic publishing
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python3 tools/release/central_portal.py --confirm-upload --bundle build/alpha/central.zip --record build/alpha/central.zip.json --output build/alpha/deployment.json
      - name: Retain deployment identity and checksums only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-alpha-deployment-${{ github.run_id }}
          path: build/alpha/deployment.json
          if-no-files-found: error
          retention-days: 14
