name: Native container candidates

on:
  pull_request:
    branches: [main, develop]
    paths: ['deployment/pdf-runtime/**', 'tools/container/**', 'tools/pdf-evaluation/**', 'nuaforma-*/**', 'gradle/**', '*.gradle.kts', '.github/workflows/native-container.yml', '.github/workflows/container-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Native container (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify wrapper and prepare Java 17 libraries / Java 25 server
        run: |
          echo '7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          test -x gradlew
          ./gradlew --no-daemon build :nuaforma-server:installDist :nuaforma-playground:installDist :nuaforma-server:prepareMountedProviderQualification :nuaforma-docx-pdf:preparePdfValidation :nuaforma-docx-pdf:prepareVeraPdfValidation --warning-mode=fail
          python3 tools/container/prepare_verapdf_materials.py nuaforma-docx-pdf/build/verapdf-validation
          python3 tools/container/prepare_application_materials.py
          python3 tools/container/prepare_application_materials.py --application nuaforma-playground/build/install/nuaforma-playground
      - name: Build native candidate without publishing
        run: |
          docker build --platform linux/${{ matrix.architecture }} --file deployment/pdf-runtime/Dockerfile \
            --build-context pdfvalidation=nuaforma-docx-pdf/build/pdf-validation \
            --build-context verapdfvalidation=nuaforma-docx-pdf/build/verapdf-validation \
            --build-context application=nuaforma-server/build/install/nuaforma-server \
            --target service --tag nuaforma:native-candidate deployment/pdf-runtime
          docker build --platform linux/${{ matrix.architecture }} --file deployment/pdf-runtime/Dockerfile \
            --build-context pdfvalidation=nuaforma-docx-pdf/build/pdf-validation \
            --build-context verapdfvalidation=nuaforma-docx-pdf/build/verapdf-validation \
            --build-context application=nuaforma-server/build/install/nuaforma-server \
            --build-context playgroundapplication=nuaforma-playground/build/install/nuaforma-playground \
            --target playground --tag nuaforma-playground:native-candidate deployment/pdf-runtime
      - name: Check native platform, runtime default policies and real service
        run: |
          python3 tools/container/verify_native_platform.py --image nuaforma:native-candidate --architecture ${{ matrix.architecture }}
          python3 tools/container/qualify_service.py --image nuaforma:native-candidate --output build/native-container/qualification
          python3 tools/container/qualify_endpoints.py --image nuaforma:native-candidate --architecture ${{ matrix.architecture }} --application server --output build/native-container/endpoints
          python3 tools/container/qualify_endpoints.py --image nuaforma-playground:native-candidate --architecture ${{ matrix.architecture }} --application playground --output build/native-container/playground
          ./gradlew :nuaforma-server:validateSbomFile -PsbomFile=build/native-container/endpoints/sbom.json --warning-mode=fail
          ./gradlew :nuaforma-server:validateSbomFile -PsbomFile=build/native-container/playground/sbom.json --warning-mode=fail
      - name: Qualify fonts and trusted extension boundaries with existing native tools
        run: |
          mkdir -p build/native-container/fonts build/native-container/extensions
          cp nuaforma-server/build/mounted-provider-qualification/mounted-provider.jar build/native-container/extensions/
          cp nuaforma-docx/src/test/resources/fonts/LibreBarcode39-Regular.ttf build/native-container/fonts/
          python3 tools/container/qualify_java_runtime.py --image nuaforma:native-candidate --architecture ${{ matrix.architecture }} --fonts build/native-container/fonts --extensions build/native-container/extensions --output build/native-container/java-runtime
      - name: Verify independent Java 17 consumer with runtime default policies
        run: |
          ./gradlew verifyEmbeddedConsumers --warning-mode=fail
          python3 tools/release/verify_embedded_pdf.py --docker docker --image nuaforma:native-candidate --source build/native-container/qualification/document.docx --output build/native-container/embedded-pdf


      - name: Retain exact source-review inventories without container binaries
        run: |
          python3 tools/container/collect_inventory.py --image nuaforma:native-candidate --destination build/native-container/inventory/server
          python3 tools/container/collect_inventory.py --image nuaforma-playground:native-candidate --destination build/native-container/inventory/playground
          python3 - <<'PY'
          import json, os, pathlib
          identity = {key: os.environ[key] for key in ('GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_RUN_ID')}
          pathlib.Path('build/native-container/inventory/source.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
      - name: Upload only non-executable inventory and source identity evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-source-inventory-${{ matrix.architecture }}
          path: build/native-container/inventory/
          if-no-files-found: error
          retention-days: 30

# No binary artifacts, registry writes, image push or security-policy bypass.
