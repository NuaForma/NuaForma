name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/site/**', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['site/**', 'tools/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Website checks
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.site-change.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Deploy only changed website content or an explicit manual request
        id: site-change
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if test "$EVENT_NAME" = workflow_dispatch; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^ HEAD -- site/; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            status=$?
            test "$status" -eq 1
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate static content and downloads
        run: python3 tools/site/check_site.py
      - name: Check JavaScript syntax
        run: node --check site/app.js
      - name: Check Compose configuration
        run: |
          for kit in docker docker-arm64; do
            docker compose --project-directory "site/downloads/$kit" config --quiet
            docker compose --project-directory "site/downloads/$kit" --file "site/downloads/$kit/compose.yaml" --file "site/downloads/$kit/compose.apparmor.yaml" config --quiet
          done
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check.outputs.deploy == 'true'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
